<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Book</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14; --surface: #161a24; --surface2: #1e2332;
    --border: #2a3045; --accent: #4fffb0; --accent2: #7b6fff;
    --red: #ff4f6a; --text: #e8eaf2; --muted: #6b7394; --card: #181d2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 80px; }

  /* NAV TABS */
  .tabs { display: flex; gap: 0; width: 100%; max-width: 480px;
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 4px; margin-bottom: 24px; }
  .tab { flex: 1; padding: 10px; border: none; border-radius: 10px;
    background: transparent; color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: .8rem; cursor: pointer;
    transition: background .2s, color .2s; }
  .tab.active { background: var(--accent); color: #0d0f14; font-weight: 700; }

  /* HEADER */
  .page-header { width: 100%; max-width: 480px; display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 20px; }
  .page-header h2 { font-family: 'Space Mono', monospace; font-size: 1.1rem; color: var(--accent); }
  .count-badge { font-family: 'Space Mono', monospace; font-size: .72rem;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); padding: 3px 10px; border-radius: 99px; }

  /* VIEWS */
  .view { width: 100%; max-width: 480px; display: none; }
  .view.active { display: block; }

  /* ── CONTACTS VIEW ── */
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-wrap input { width: 100%; padding: 13px 18px 13px 44px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 1rem; outline: none; transition: border-color .2s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap .ico { position: absolute; left: 15px; top: 50%;
    transform: translateY(-50%); color: var(--muted); font-size: 1rem; }
  .add-btn { width: 100%; padding: 13px; background: var(--accent); color: #0d0f14;
    border: none; border-radius: 14px; font-family: 'Space Mono', monospace;
    font-size: .88rem; font-weight: 700; cursor: pointer; margin-bottom: 20px;
    transition: transform .15s, box-shadow .15s; }
  .add-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px #4fffb033; }
  #contact-list { display: flex; flex-direction: column; gap: 11px; }
  .empty-msg { text-align: center; color: var(--muted); font-family: 'Space Mono', monospace;
    font-size: .82rem; padding: 44px 0; border: 1.5px dashed var(--border); border-radius: 16px; }
  .contact-card { background: var(--card); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 15px 16px; display: flex; align-items: center; gap: 13px;
    transition: border-color .2s, transform .15s; animation: slideIn .22s ease; }
  .contact-card:hover { border-color: var(--accent2); transform: translateX(3px); }
  @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1rem; flex-shrink: 0; }
  .contact-info { flex: 1; min-width: 0; }
  .contact-info .name { font-weight: 600; font-size: .97rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-info .phone { font-family: 'Space Mono', monospace; font-size: .76rem; color: var(--accent); margin-top: 2px; }
  .contact-info .email { font-size: .73rem; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-actions { display: flex; gap: 7px; flex-shrink: 0; }
  .card-actions button { width: 32px; height: 32px; border: none; border-radius: 9px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .95rem;
    transition: transform .15s; }
  .card-actions button:hover { transform: scale(1.15); }
  .btn-edit { background: #1f1e2e; color: var(--accent2); }
  .btn-del  { background: #2e1a1e; color: var(--red); }

  /* ── DIAL PAD VIEW ── */
  .dial-display-wrap { background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 18px 18px 14px; margin-bottom: 14px; }
  .dial-number { font-family: 'Space Mono', monospace; font-size: 2rem; color: var(--accent);
    text-align: center; letter-spacing: 4px; min-height: 48px; word-break: break-all; }
  .dial-name-hint { text-align: center; font-size: .82rem; color: var(--muted); margin-top: 6px;
    min-height: 20px; font-style: italic; }

  /* Suggestions */
  #suggestions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .suggestion { background: var(--card); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: border-color .2s; animation: slideIn .2s ease; }
  .suggestion:hover { border-color: var(--accent); }
  .sug-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: .8rem; flex-shrink: 0; }
  .sug-info { flex: 1; min-width: 0; }
  .sug-name { font-weight: 600; font-size: .9rem; }
  .sug-phone { font-family: 'Space Mono', monospace; font-size: .72rem; color: var(--accent); }

  /* Keypad */
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .key { padding: 16px 0; border-radius: 16px; background: var(--surface);
    border: 1.5px solid var(--border); color: var(--text);
    font-family: 'Space Mono', monospace; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    justify-content: center; line-height: 1.2; transition: background .12s, border-color .12s, transform .08s;
    user-select: none; }
  .key:active { transform: scale(.94); background: var(--surface2); }
  .key sub { font-size: .5rem; color: var(--muted); letter-spacing: 1.5px; margin-top: 1px; }
  .dial-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .key-call { background: #1a2e1e; color: var(--accent); font-size: 1.4rem; border-color: #1a2e1e; }
  .key-call:active { background: #223d2b; }
  .key-backspace { color: var(--red); font-size: 1.2rem; }
  .key-clear { color: var(--muted); font-size: .75rem; font-family: 'DM Sans', sans-serif; }

  /* ── MODALS ── */
  .overlay { position: fixed; inset: 0; background: #000a; backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.active { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface2); border: 1.5px solid var(--border); border-radius: 22px;
    padding: 26px 24px; width: 100%; max-width: 400px;
    transform: translateY(20px); transition: transform .25s; }
  .overlay.active .modal { transform: translateY(0); }
  .modal h2 { font-family: 'Space Mono', monospace; font-size: 1.05rem; color: var(--accent); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 5px;
    letter-spacing: .5px; text-transform: uppercase; }
  .field input { width: 100%; padding: 11px 13px; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 11px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: .93rem; outline: none; transition: border-color .2s; }
  .field input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-cancel { flex: 1; padding: 11px; background: transparent; border: 1.5px solid var(--border);
    border-radius: 11px; color: var(--muted); font-family: 'Space Mono', monospace;
    font-size: .8rem; cursor: pointer; transition: border-color .2s, color .2s; }
  .btn-cancel:hover { border-color: var(--red); color: var(--red); }
  .btn-save { flex: 2; padding: 11px; background: var(--accent); border: none; border-radius: 11px;
    color: #0d0f14; font-family: 'Space Mono', monospace; font-size: .8rem; font-weight: 700; cursor: pointer; }
  .btn-save:hover { box-shadow: 0 4px 20px #4fffb040; }
  .del-msg { color: var(--muted); font-size: .9rem; margin-bottom: 18px; line-height: 1.5; }
  .del-msg strong { color: var(--text); }
  .btn-confirm-del { flex: 2; padding: 11px; background: var(--red); border: none;
    border-radius: 11px; color: #fff; font-family: 'Space Mono', monospace; font-size: .8rem; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('contacts')">👥 Contacts</button>
  <button class="tab" onclick="switchTab('dialpad')">📞 Dial Pad</button>
</div>

<!-- CONTACTS VIEW -->
<div class="view active" id="view-contacts">
  <div class="page-header">
    <h2>My Contacts</h2>
    <span id="count-badge" class="count-badge">0 saved</span>
  </div>
  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input type="text" id="search-input" placeholder="Search name, phone or email…">
  </div>
  <button class="add-btn" onclick="openAdd()">＋  Add New Contact</button>
  <div id="contact-list"></div>
</div>

<!-- DIAL PAD VIEW -->
<div class="view" id="view-dialpad">
  <div class="dial-display-wrap">
    <div class="dial-number" id="dial-number">–</div>
    <div class="dial-name-hint" id="dial-name-hint"></div>
  </div>

  <!-- Matching contacts -->
  <div id="suggestions"></div>

  <!-- Number keys -->
  <div class="keypad" id="keypad"></div>

  <!-- Bottom actions: call, backspace, clear -->
  <div class="dial-actions">
    <button class="key key-clear" onclick="dialClear()">CLEAR</button>
    <button class="key key-call" onclick="dialCall()">📞</button>
    <button class="key key-backspace" onclick="dialBack()">⌫</button>
  </div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="form-modal">
  <div class="modal">
    <h2 id="form-title">New Contact</h2>
    <div class="field"><label>Full Name</label><input id="f-name" placeholder="e.g. Ada Lovelace"></div>
    <div class="field"><label>Phone Number</label><input id="f-phone" placeholder="+91 98765 43210" type="tel"></div>
    <div class="field"><label>Email Address</label><input id="f-email" placeholder="ada@example.com" type="email"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('form-modal')">Cancel</button>
      <button class="btn-save" onclick="saveContact()">💾 Save</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="overlay" id="del-modal">
  <div class="modal">
    <h2>🗑 Delete Contact</h2>
    <p class="del-msg">Delete <strong id="del-name"></strong>? This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('del-modal')">Cancel</button>
      <button class="btn-confirm-del" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
  // ── Data ─────────────────────────────────────────────
  let contacts = JSON.parse(localStorage.getItem('cb2_contacts') || 'null') || [];
  let editId = null, deleteId = null, dialStr = '';

  function save() { localStorage.setItem('cb2_contacts', JSON.stringify(contacts)); }

  const COLORS = [
    ['#4fffb022','#4fffb0'],['#7b6fff22','#7b6fff'],['#ff4f6a22','#ff4f6a'],
    ['#ffd16622','#ffd166'],['#06d6a022','#06d6a0'],['#ef476f22','#ef476f'],
  ];
  function ac(id) { return COLORS[Math.abs(id) % COLORS.length]; }
  function initials(n) { return n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2); }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── Tab switching ─────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='contacts')||(i===1&&tab==='dialpad')));
    document.getElementById('view-contacts').classList.toggle('active', tab==='contacts');
    document.getElementById('view-dialpad').classList.toggle('active', tab==='dialpad');
  }

  // ── Contacts render ───────────────────────────────────
  function filtered() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    if (!q) return contacts;
    return contacts.filter(c =>
      c.name.toLowerCase().includes(q) || c.phone.includes(q) || c.email.toLowerCase().includes(q)
    );
  }

  function render(list) {
    document.getElementById('count-badge').textContent = contacts.length + ' saved';
    const el = document.getElementById('contact-list');
    if (!list.length) { el.innerHTML = '<div class="empty-msg">📭 No contacts found</div>'; return; }
    el.innerHTML = list.map(c => {
      const [bg,fg] = ac(c.id);
      return `<div class="contact-card">
        <div class="avatar" style="background:${bg};color:${fg}">${initials(c.name)}</div>
        <div class="contact-info">
          <div class="name">${esc(c.name)}</div>
          <div class="phone">${esc(c.phone)}</div>
          <div class="email">${esc(c.email)}</div>
        </div>
        <div class="card-actions">
          <button class="btn-edit" onclick="openEdit(${c.id})" title="Edit">✏️</button>
          <button class="btn-del"  onclick="openDelete(${c.id})" title="Delete">🗑</button>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('search-input').addEventListener('input', () => render(filtered()));

  // ── Add / Edit ────────────────────────────────────────
  function openAdd() {
    editId = null;
    document.getElementById('form-title').textContent = '✨ New Contact';
    ['f-name','f-phone','f-email'].forEach(id => document.getElementById(id).value = '');
    openModal('form-modal');
    setTimeout(()=>document.getElementById('f-name').focus(),250);
  }

  function openEdit(id) {
    const c = contacts.find(x=>x.id===id); if(!c) return;
    editId = id;
    document.getElementById('form-title').textContent = '✏️ Edit Contact';
    document.getElementById('f-name').value = c.name;
    document.getElementById('f-phone').value = c.phone;
    document.getElementById('f-email').value = c.email;
    openModal('form-modal');
    setTimeout(()=>document.getElementById('f-name').focus(),250);
  }

  function saveContact() {
    const name  = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const email = document.getElementById('f-email').value.trim();
    if (!name||!phone) { alert('Name and phone are required.'); return; }
    if (editId!==null) {
      const c = contacts.find(x=>x.id===editId);
      c.name=name; c.phone=phone; c.email=email;
    } else {
      contacts.push({id:Date.now(),name,phone,email});
    }
    save(); closeModal('form-modal'); render(filtered());
  }

  // ── Delete ────────────────────────────────────────────
  function openDelete(id) {
    deleteId = id;
    const c = contacts.find(x=>x.id===id);
    document.getElementById('del-name').textContent = c?c.name:'';
    openModal('del-modal');
  }

  function confirmDelete() {
    contacts = contacts.filter(c=>c.id!==deleteId);
    save(); closeModal('del-modal'); render(filtered());
  }

  // ── Dial Pad ──────────────────────────────────────────
  const KEYS = [
    {d:'1',s:''},{d:'2',s:'ABC'},{d:'3',s:'DEF'},
    {d:'4',s:'GHI'},{d:'5',s:'JKL'},{d:'6',s:'MNO'},
    {d:'7',s:'PQRS'},{d:'8',s:'TUV'},{d:'9',s:'WXYZ'},
    {d:'*',s:''},{d:'0',s:'+'},{d:'#',s:''},
  ];

  function buildKeypad() {
    document.getElementById('keypad').innerHTML = KEYS.map(k =>
      `<button class="key" onclick="dialPress('${k.d}')">${k.d}<sub>${k.s}</sub></button>`
    ).join('');
  }

  function updateDial() {
    const display = document.getElementById('dial-number');
    const hint    = document.getElementById('dial-name-hint');
    const sugBox  = document.getElementById('suggestions');

    // Format display with spaces every 5 digits
    display.textContent = dialStr || '–';

    if (!dialStr) { hint.textContent=''; sugBox.innerHTML=''; return; }

    // Find contacts whose phone contains the dialled digits (strip non-digits for comparison)
    const stripped = dialStr.replace(/\D/g,'');
    const matches = contacts.filter(c => c.phone.replace(/\D/g,'').includes(stripped));

    if (matches.length === 1) {
      hint.textContent = matches[0].name;
    } else {
      hint.textContent = matches.length > 1 ? matches.length + ' matches' : '';
    }

    // Show suggestion cards (max 3)
    sugBox.innerHTML = matches.slice(0,3).map(c => {
      const [bg,fg] = ac(c.id);
      return `<div class="suggestion" onclick="selectSuggestion(${c.id})">
        <div class="sug-avatar" style="background:${bg};color:${fg}">${initials(c.name)}</div>
        <div class="sug-info">
          <div class="sug-name">${esc(c.name)}</div>
          <div class="sug-phone">${esc(c.phone)}</div>
        </div>
        <span style="color:var(--accent);font-size:1.1rem">📞</span>
      </div>`;
    }).join('');
  }

  function dialPress(d) {
    if (dialStr.length >= 15) return;
    dialStr += d; updateDial();
  }

  function dialBack() {
    dialStr = dialStr.slice(0,-1); updateDial();
  }

  function dialClear() {
    dialStr = ''; updateDial();
  }

  function dialCall() {
    if (!dialStr) return;
    window.location.href = 'tel:' + dialStr.replace(/\s/g,'');
  }

  function selectSuggestion(id) {
    const c = contacts.find(x=>x.id===id); if(!c) return;
    dialStr = c.phone.replace(/\s/g,'');
    updateDial();
  }

  // ── Modals ────────────────────────────────────────────
  function openModal(id)  { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  document.querySelectorAll('.overlay').forEach(o =>
    o.addEventListener('click', e => { if(e.target===o) o.classList.remove('active'); })
  );

  // ── Init ──────────────────────────────────────────────
  if (!contacts.length) {
    contacts = [
      {id:1, name:'Mam',         phone:'+919876543210', email:'mam@home.in'},
      {id:2, name:'Dad',         phone:'+918765432109', email:'dad@home.in'},
      {id:3, name:'Best Friend', phone:'+917654321098', email:'friend@gmail.com'},
    ];
    save();
  }
  buildKeypad();
  render(filtered());
</script>
</body>
</html>
